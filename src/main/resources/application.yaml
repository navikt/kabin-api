spring:
  application:
    name: kabin-api
  main:
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  mvc:
    log-request-details: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${NAIS_DATABASE_KABIN_API_KABIN_API_JDBC_URL}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-on-validation-error: false
    schemas: flyway_history_schema,klage
    connect-retries: 2
  jpa:
    open-in-view: false
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100

server:
  port: 7083
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  health:
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true


KABAL_API_BASE_URL: http://kabal-api
KABAL_API_APP_NAME: kabal-api
KABAL_INNSTILLINGER_BASE_URL: http://kabal-innstillinger
KABAL_INNSTILLINGER_APP_NAME: kabal-innstillinger
KABAL_FILE_API_BASE_URL: http://kabal-file-api
KABAL_FILE_API_APP_NAME: kabal-file-api
KLAGE_LOOKUP_APP_NAME: klage-lookup
KLAGE_LOOKUP_BASE_URL: http://klage-lookup

KLAGE_UNLEASH_PROXY_URL: http://klage-unleash-proxy

SERVICE_USER_USERNAME: srvklage-saksbeh

MICROSOFT_GRAPH_URL: https://graph.microsoft.com/v1.0